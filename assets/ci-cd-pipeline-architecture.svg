<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1550" role="img" aria-labelledby="title desc">
  <title id="title">CI/CD architecture for the customer churn MLOps project</title>
  <desc id="desc">GitHub Actions triggers feed parallel code and data quality checks, followed by model training, MLflow tracking, evaluation and approval. The approved model branches into Docker and GHCR delivery and a separate customer-scoring job. A CI status job aggregates required workflow results.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#70ded8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1929"/><stop offset="1" stop-color="#08111f"/></linearGradient>
  </defs>
  <rect width="1800" height="1550" rx="24" fill="url(#bg)"/>
  <path d="M45 150 H1755" stroke="#20364b" stroke-width="1"/>
  <text x="86" y="82" fill="#73e0dc" font-family="monospace" font-size="22" letter-spacing="3">MLOPS ENGINEERING / SYSTEM DESIGN</text>
  <text x="86" y="125" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="38" font-weight="700">Customer churn · CI/CD architecture</text>
  <rect x="1430" y="58" width="284" height="42" rx="21" fill="#153246" stroke="#326071"/>
  <text x="1572" y="85" text-anchor="middle" fill="#a9e9e5" font-family="monospace" font-size="15" letter-spacing="1">TEAM PROJECT · WORKFLOW VIEW</text>

  <!-- connectors -->
  <g fill="none" stroke="#70ded8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M900 267 V292 H480 V325"/>
    <path d="M900 292 H1320 V325"/>
    <path d="M480 509 V545 H900 V575"/>
    <path d="M1320 509 V545 H900"/>
    <path d="M900 707 V750"/>
    <path d="M900 968 V1010"/>
    <path d="M900 1108 V1165 H480 V1200"/>
    <path d="M900 1165 H1320 V1200"/>
    <path d="M480 1420 V1442 H900 V1463"/>
  </g>
  <g fill="#70ded8"><circle cx="900" cy="292" r="5"/><circle cx="900" cy="545" r="5"/><circle cx="900" cy="1165" r="5"/></g>

  <!-- trigger -->
  <rect x="530" y="165" width="740" height="102" rx="14" fill="#12283b" stroke="#3b7180" stroke-width="2"/>
  <text x="570" y="204" fill="#73e0dc" font-family="monospace" font-size="18" letter-spacing="2">01 / WORKFLOW TRIGGER</text>
  <text x="570" y="238" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="21">push to main · pull request to main · weekly schedule · manual dispatch</text>

  <!-- parallel checks -->
  <rect x="90" y="325" width="780" height="184" rx="14" fill="#12283b" stroke="#3b7180" stroke-width="2"/>
  <rect x="90" y="325" width="9" height="184" rx="4" fill="#73e0dc"/>
  <text x="130" y="370" fill="#73e0dc" font-family="monospace" font-size="18" letter-spacing="2">02A / CODE QUALITY</text>
  <text x="130" y="410" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Python test matrix</text>
  <text x="130" y="443" fill="#b9c9d8" font-family="Arial, sans-serif" font-size="18">Python 3.11 · 3.12 · 3.13</text>
  <rect x="130" y="463" width="190" height="30" rx="6" fill="#1d4050"/><text x="225" y="484" text-anchor="middle" fill="#c4f4f0" font-family="monospace" font-size="15">Ruff lint</text>
  <rect x="335" y="463" width="190" height="30" rx="6" fill="#1d4050"/><text x="430" y="484" text-anchor="middle" fill="#c4f4f0" font-family="monospace" font-size="15">Pytest suite</text>
  <text x="560" y="482" fill="#91a9bc" font-family="Arial, sans-serif" font-size="15">Changed code paths</text>

  <rect x="930" y="325" width="780" height="184" rx="14" fill="#12283b" stroke="#806cae" stroke-width="2"/>
  <rect x="930" y="325" width="9" height="184" rx="4" fill="#bca8f4"/>
  <text x="970" y="370" fill="#c7b8fa" font-family="monospace" font-size="18" letter-spacing="2">02B / DATA QUALITY</text>
  <text x="970" y="410" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Validation matrix</text>
  <text x="970" y="443" fill="#b9c9d8" font-family="Arial, sans-serif" font-size="18">Reference data: data/kundbas.csv</text>
  <rect x="970" y="463" width="250" height="30" rx="6" fill="#332d50"/><text x="1095" y="484" text-anchor="middle" fill="#e2d9ff" font-family="monospace" font-size="15">Pandera schema</text>
  <rect x="1235" y="463" width="300" height="30" rx="6" fill="#332d50"/><text x="1385" y="484" text-anchor="middle" fill="#e2d9ff" font-family="monospace" font-size="15">Statistical drift checks</text>
  <text x="1555" y="482" fill="#91a9bc" font-family="Arial, sans-serif" font-size="14">matrix cases</text>

  <!-- training -->
  <rect x="560" y="575" width="680" height="132" rx="14" fill="#142c3e" stroke="#3b7180" stroke-width="2"/>
  <text x="600" y="615" fill="#73e0dc" font-family="monospace" font-size="18" letter-spacing="2">03 / TRAIN MODEL</text>
  <text x="600" y="651" fill="#f0f6fc" font-family="monospace" font-size="20">uv run python -m churn.model</text>
  <text x="600" y="682" fill="#b9c9d8" font-family="Arial, sans-serif" font-size="17">MLflow tracking · candidate model artifact · run data</text>

  <!-- evaluation -->
  <rect x="500" y="750" width="800" height="218" rx="14" fill="#182b42" stroke="#8a77b9" stroke-width="2"/>
  <rect x="500" y="750" width="9" height="218" rx="4" fill="#bca8f4"/>
  <text x="545" y="794" fill="#c7b8fa" font-family="monospace" font-size="18" letter-spacing="2">04 / EVALUATE &amp; APPROVE</text>
  <text x="545" y="835" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="22" font-weight="700">Integrity check + metrics summary</text>
  <text x="545" y="871" fill="#b9c9d8" font-family="Arial, sans-serif" font-size="18">Evaluation threshold + regression gate against approved baseline</text>
  <path d="M545 891 H1255" stroke="#364c63" stroke-width="1"/>
  <text x="545" y="925" fill="#d5f5f2" font-family="Arial, sans-serif" font-size="18">On success: register model in MLflow and publish versioned artifact</text>
  <text x="545" y="951" fill="#9eb1c3" font-family="Arial, sans-serif" font-size="15">MLflow tracking data is uploaded separately for traceability</text>

  <!-- approved artifact -->
  <rect x="560" y="1010" width="680" height="98" rx="14" fill="#153a42" stroke="#73e0dc" stroke-width="2"/>
  <text x="600" y="1050" fill="#9ff0ea" font-family="monospace" font-size="18" letter-spacing="2">APPROVED OUTPUT</text>
  <text x="600" y="1082" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="22" font-weight="700">model-{commit SHA} · verified, versioned model artifact</text>

  <!-- delivery branch -->
  <rect x="90" y="1200" width="780" height="220" rx="14" fill="#12283b" stroke="#3b7180" stroke-width="2"/>
  <rect x="90" y="1200" width="9" height="220" rx="4" fill="#73e0dc"/>
  <text x="130" y="1245" fill="#73e0dc" font-family="monospace" font-size="18" letter-spacing="2">05A / PACKAGE &amp; PUBLISH</text>
  <text x="130" y="1287" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="18">1. Download approved model + verify artifact integrity</text>
  <text x="130" y="1323" fill="#c4d2df" font-family="Arial, sans-serif" font-size="18">2. Multi-stage Docker build with Buildx GHA layer cache</text>
  <text x="130" y="1359" fill="#c4d2df" font-family="Arial, sans-serif" font-size="18">3. Run container smoke tests: GET /health + POST /predict</text>
  <text x="130" y="1395" fill="#9ff0ea" font-family="Arial, sans-serif" font-size="18">4. Push SHA + latest tags to GHCR on push to main only</text>

  <!-- scoring branch -->
  <rect x="930" y="1200" width="780" height="220" rx="14" fill="#12283b" stroke="#806cae" stroke-width="2"/>
  <rect x="930" y="1200" width="9" height="220" rx="4" fill="#bca8f4"/>
  <text x="970" y="1245" fill="#c7b8fa" font-family="monospace" font-size="18" letter-spacing="2">05B / CUSTOMER SCORING</text>
  <text x="970" y="1287" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="18">Runs on main branch for non-PR events</text>
  <text x="970" y="1323" fill="#c4d2df" font-family="Arial, sans-serif" font-size="18">Verify approved model artifact integrity</text>
  <text x="970" y="1359" fill="#c4d2df" font-family="Arial, sans-serif" font-size="18">Run customer scoring with churn.score</text>
  <text x="970" y="1395" fill="#d9ceff" font-family="monospace" font-size="18">Upload output: outputs/call_list.csv</text>

  <!-- CI status -->
  <rect x="420" y="1463" width="960" height="68" rx="12" fill="#1a3045" stroke="#52748b" stroke-width="1.5"/>
  <text x="455" y="1492" fill="#73e0dc" font-family="monospace" font-size="16" letter-spacing="1">CI-COMPLETE / QUALITY SUMMARY</text>
  <text x="455" y="1517" fill="#d1dce7" font-family="Arial, sans-serif" font-size="16">Aggregates changes · test · validate · train · evaluate · package; fails if a required job fails or is cancelled.</text>
</svg>