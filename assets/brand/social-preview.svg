<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Erfan Tahmasebi — MLOps Engineering</title>
<desc id="desc">Portfolio social preview showing Erfan Tahmasebi, MLOps Engineering student, and a machine learning workflow from data quality to deployment.</desc>
<defs>
